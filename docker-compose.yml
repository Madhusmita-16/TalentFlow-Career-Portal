version: '3.8'

services:
  database:
    image: mysql:8.0
    container_name: talentflow-mysql
    environment:
      MYSQL_DATABASE: talentflow_db
      MYSQL_ROOT_PASSWORD: rootpassword
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: talentflow-backend
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://database:3306/talentflow_db?useSSL=false&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: rootpassword
    depends_on:
      - database

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: talentflow-frontend
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  mysql_data:
